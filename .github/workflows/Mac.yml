name: mac
on:
  push:
  workflow_dispatch:
jobs:
  vm:
    runs-on: macos-15
    steps:
      - name: Enable VNC
        env:
          VNCPASS: ${{ secrets.VNC_PASS }}
        run: |
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $K -activate -configure -access -on -restart -agent -privs -all
          sudo $K -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNCPASS"
          sudo $K -restart -agent
      - name: Install noVNC
        run: |
          pip3 install --break-system-packages websockify
          git clone --depth 1 https://github.com/novnc/noVNC.git
          nohup python3 -m websockify --web noVNC 6080 localhost:5900 > /dev/null 2>&1 &
      - name: Tunnel
        run: |
          brew install cloudflared
          cloudflared tunnel --url http://localhost:6080
